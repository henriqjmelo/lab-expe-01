name: Lab03 - testes

on:
  push:
    paths:
      - "lab-expe-03/**"
      - ".github/workflows/lab03-testes.yml"
  pull_request:
    paths:
      - "lab-expe-03/**"
      - ".github/workflows/lab03-testes.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-expe-03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-analise.txt
      - run: python -m pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
