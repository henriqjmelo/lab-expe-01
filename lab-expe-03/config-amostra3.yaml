# Amostra 3 (issue #157): mesma janela e filtros das amostras 1 e 2, semente nova,
# sem repetir nenhum repositorio ja sorteado. Fecha os 900 repositorios do estudo.
# Uso: CONFIG=config-amostra3.yaml LOG=.cache/coleta-amostra3.log scripts/coletar.sh
# Caminhos relativos a esta pasta.

janela:
  # 12 meses. Ajustar para as datas fixadas pelo professor se forem outras.
  inicio: 2025-10-01
  fim: 2026-09-30        # inclusive

amostra:
  alvo: 300              # para quando atingir este numero de repositorios aceitos
  semente: 2027          # semente distinta de A1 (42) e A2 (2026)
  excluir:               # amostra 3 nao repete repositorio de A1 nem de A2
    - data/repositorios.csv
    - data/amostra2/repositorios.csv

busca:
  # Cada consulta da Search API devolve no maximo 1.000 resultados: fatiar.
  # null = sem limite superior.
  faixas_estrelas:
    - [1000, 1199]
    - [1200, 1499]
    - [1500, 1999]
    - [2000, 2999]
    - [3000, 4999]
    - [5000, 9999]
    - [10000, 19999]
    - [20000, 49999]
    - [50000, null]

inclusao:
  min_releases: 5
  min_runs_validos: 50

coleta:
  # Um compare por deploy na janela; acima disso o lead time da unidade fica vazio
  # (coluna lt_<unidade>_omitido = True) para nao estourar a cota.
  max_compares_por_unidade: 300
  cache: .cache/github
  # Tolerancia a falhas:
  max_tentativas_chamada: 8      # por chamada HTTP (5xx/rede), backoff 1 s, 2 s, 4 s... ~2 min
  retentativas_repositorio: 3    # por repositorio, esperando 30 s, 60 s, 120 s
  espera_retentativa_s: 30
  gravar_parcial_a_cada: 10      # regrava os CSVs a cada 10 repositorios aceitos
  # Candidatos avaliados em paralelo. O teto real e a cota (5.000 chamadas/h):
  # com ~3 threads a coleta ja encosta nela; mais que isso so gera espera.
  threads: 3
  # Meses de workflow runs baixados em paralelo dentro de um mesmo repositorio
  # (repositorios gigantes como getsentry/sentry levam horas numa thread so).
  threads_runs: 3
  # Candidatos adiantados na fila: as threads livres seguem trabalhando enquanto
  # um repositorio pesado na frente termina. A ordem do funil nao muda.
  adiantar: 30
  # Sem nenhuma chamada concluida por este tempo (fora de espera de cota/backoff),
  # o processo sai com codigo 75 e scripts/coletar.sh reinicia. 0 desliga.
  watchdog_minutos: 10
  # Se o candidato da frente da fila nao terminar em tantos minutos (conexao presa,
  # resposta chegando a conta-gotas), grava os CSVs parciais e sai para reiniciar.
  sem_progresso_minutos: 60

saida:
  dataset: data/amostra3/dataset_dora.csv
  repositorios: data/amostra3/repositorios.csv
  funil: data/amostra3/funil.csv
  descartes: data/amostra3/descartes.csv
